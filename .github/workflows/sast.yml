name: SAST
on:
  workflow_call:
permissions:
  contents: read
jobs:
  bandit:
    name: Bandit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-security.txt
      - name: Python SAST (medium/high fail)
        run: |
          mkdir -p reports
          bandit -r environment.py network_guard.py network_transport.py tls_trust.py route_guard.py ubuntu_image.py release_image.py session_lock.py macos windows scripts guest -ll -f json -o reports/bandit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sast-bandit
          path: reports/
          if-no-files-found: warn
  codeql:
    name: CodeQL (${{ matrix.language }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            os: ubuntu-24.04
            mode: none
          - language: swift
            os: macos-15
            mode: manual
          - language: actions
            os: ubuntu-24.04
            mode: none
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.mode }}
          queries: security-extended
      - if: matrix.language == 'swift'
        run: python macos/build.py --arch arm64 --analysis-only
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          output: reports/codeql
          upload: never
          # SARIF is gated and uploaded below. Publishing the optional full
          # query database adds another large network transfer with no gate.
          upload-database: false
      - name: Enforce security threshold
        run: python scripts/sarif_gate.py reports/codeql
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sast-codeql-${{ matrix.language }}
          path: reports/codeql/
          if-no-files-found: warn
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always() && github.event_name != 'pull_request' && github.event.repository.private == false
        with:
          sarif_file: reports/codeql
          category: ${{ matrix.language }}
