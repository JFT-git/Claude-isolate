name: SAST
on:
  workflow_call:
permissions:
  contents: read
jobs:
  bandit:
    name: Bandit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-security.txt
      - name: Python SAST (medium/high fail)
        run: |
          mkdir -p reports
          bandit -r environment.py network_guard.py network_transport.py route_guard.py macos scripts -ll -f json -o reports/bandit.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sast-bandit
          path: reports/
          if-no-files-found: warn
  codeql:
    name: CodeQL (${{ matrix.language }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            os: ubuntu-24.04
            mode: none
          - language: swift
            os: macos-15
            mode: manual
          - language: actions
            os: ubuntu-24.04
            mode: none
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.mode }}
          queries: security-extended
      - if: matrix.language == 'swift'
        run: python macos/build.py --arch arm64
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          output: reports/codeql
          upload: false
      - name: Enforce security threshold
        run: python scripts/sarif_gate.py reports/codeql
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sast-codeql-${{ matrix.language }}
          path: reports/codeql/
          if-no-files-found: warn
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && github.event_name != 'pull_request' && github.event.repository.private == false
        with:
          sarif_file: reports/codeql
          category: ${{ matrix.language }}
