name: SCA and secrets
on:
  workflow_call:
permissions:
  contents: read
jobs:
  dependencies:
    name: Python dependencies and secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-security.txt
      - name: Audit locked build and security tooling
        run: |
          mkdir -p reports
          pip-audit --strict --disable-pip --no-deps -r requirements-security.txt -f json -o reports/pip-audit.json
      - name: Scan source dependencies and secrets
        if: always()
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: json
          output: reports/trivy-source.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sca-source
          path: reports/
          if-no-files-found: warn
  guest:
    name: Guest dependencies (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the actual signed guest package dependency tree
        run: docker build --pull -f packaging/guest-sca.Dockerfile -t claude-guest-sca:local .
      - name: Record installed package versions
        run: |
          mkdir -p reports
          docker run --rm --network none --entrypoint cat claude-guest-sca:local /guest-packages.tsv > reports/guest-packages.tsv
          docker run --rm --network none --entrypoint dpkg-query claude-guest-sca:local -s firefox > reports/firefox-package.txt
          cp security/trivy-guest-reviewed.yaml reports/reviewed-findings.yaml
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: claude-guest-sca:local
          format: cyclonedx
          output: reports/guest.cdx.json
          exit-code: '0'
      - name: Preserve unfiltered vulnerability evidence
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: claude-guest-sca:local
          scanners: vuln
          severity: HIGH,CRITICAL
          format: json
          output: reports/guest-vulnerabilities-raw.json
          exit-code: '0'
      - name: Scan all known high/critical vulnerabilities (including unfixed)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: claude-guest-sca:local
          scanners: vuln
          severity: HIGH,CRITICAL
          format: json
          output: reports/guest-vulnerabilities.json
          trivyignores: security/trivy-guest-reviewed.yaml
          exit-code: '1'
      - name: Verify exceptions did not hide any unreviewed findings
        if: always()
        run: python3 scripts/verify_sca_filter.py reports/guest-vulnerabilities-raw.json reports/guest-vulnerabilities.json
      - name: Explain guest dependency findings
        if: always()
        run: python3 scripts/sca_summary.py reports/guest-vulnerabilities.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sca-guest-${{ matrix.arch }}
          path: reports/
          if-no-files-found: warn
