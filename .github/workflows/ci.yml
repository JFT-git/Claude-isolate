name: CI and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2022, windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - if: runner.os == 'Windows'
        run: python -m pip install --require-hashes -r requirements-windows.txt
      - if: runner.os != 'Windows'
        run: python -m pip install --require-hashes -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q environment.py network_guard.py network_transport.py tls_trust.py route_guard.py ubuntu_image.py release_image.py session_lock.py scripts macos windows
      - if: runner.os != 'Windows'
        shell: bash
        run: |
          for script in guest/*.sh packaging/*.sh; do sh -n "$script"; done
          bash -n macos/bootstrap.sh
  guest-image:
    name: Prepared guest (${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native image tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y libguestfs-tools qemu-utils qemu-system qemu-efi-aarch64 genisoimage gnupg
          sudo chmod 0644 /boot/vmlinuz-*
      - name: Build signed-vendor preinstalled image
        env:
          IMAGE_ARCH: ${{ matrix.arch }}
          IMAGE_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.3.16' }}
        run: python3 scripts/build_guest_image.py --arch "$IMAGE_ARCH" --release "$IMAGE_RELEASE"
      - name: Boot prepared image and verify desktop and isolation
        env:
          IMAGE_ARCH: ${{ matrix.arch }}
        run: |
          python3 - <<'PYCODE'
          import json, os, pathlib, subprocess
          manifest = json.loads(pathlib.Path('dist/guest/guest-image-' + os.environ['IMAGE_ARCH'] + '.json').read_text())
          subprocess.run(['python3', 'scripts/integration_vm.py', '--data', 'reports/guest-boot',
                          '--base', 'dist/guest/' + manifest['filename'], '--sha256', manifest['sha256']], check=True)
          log = pathlib.Path('reports/guest-boot/boot.log').read_text(errors='replace')
          if 'preinstalled-image no-package-downloads' not in log:
              raise RuntimeError('Prepared image did not take the no-download setup path')
          PYCODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guest-manifest-${{ matrix.arch }}
          path: dist/guest/guest-image-*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-guest-${{ matrix.arch }}
          path: |
            dist/guest/*.qcow2
            dist/guest/*.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
  macos:
    name: Build macOS (${{ matrix.arch }})
    needs: [test, guest-image]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: guest-manifest-*
          path: .
          merge-multiple: true
      - name: Compile, sign locally, verify and archive
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          python macos/build.py --arch "$TARGET_ARCH"
          ditto -c -k --sequesterRsrc --keepParent "dist/Claude Environment.app" "dist/Claude-isolate-macos-$TARGET_ARCH.zip"
          cd dist
          shasum -a 256 "Claude-isolate-macos-$TARGET_ARCH.zip" > "Claude-isolate-macos-$TARGET_ARCH.zip.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-macos-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
  portable:
    name: Package (${{ matrix.target }})
    needs: [test, guest-image]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: guest-manifest-*
          path: .
          merge-multiple: true
      - name: Package tracked source
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: python scripts/package.py --target "$TARGET"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
  windows:
    name: Build and boot Windows (${{ matrix.os }})
    needs: [test, guest-image]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: guest-manifest-*
          path: .
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-guest-x86_64
          path: dist/guest
      - name: Install hash-locked Windows tooling
        run: python -m pip install --require-hashes -r requirements-windows.txt
      - name: Test Windows setup and process ownership
        run: python -m unittest discover -s tests -p test_windows.py -v
      - name: Build GUI, worker and installer; verify clean installation
        run: python windows/build.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.os == 'windows-2022'
        with:
          name: build-windows-x64
          path: |
            dist/Claude-isolate-windows-x64.zip
            dist/Claude-isolate-windows-x64.zip.sha256
            dist/Claude-isolate-windows-x64-setup.exe
            dist/Claude-isolate-windows-x64-setup.exe.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Verify QEMU boot and packaged gateway
        run: python windows/integration.py --desktop --memory-mb ${{ matrix.os == 'windows-2022' && '1024' || '3072' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-verification-${{ matrix.os }}
          path: reports/windows/
          if-no-files-found: warn
  sast:
    uses: ./.github/workflows/sast.yml
    permissions:
      contents: read
      security-events: write
  sca:
    uses: ./.github/workflows/sca.yml
    permissions:
      contents: read
  release:
    name: Publish prerelease
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [test, guest-image, macos, portable, windows, sast, sca]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-*
          path: dist
          merge-multiple: true
      - name: Verify checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check ./*.sha256
          gh release create "$RELEASE_TAG" ./*.zip ./*.exe ./*.qcow2 ./*.sha256 --verify-tag --prerelease --generate-notes --title "Claude Isolate $RELEASE_TAG"
